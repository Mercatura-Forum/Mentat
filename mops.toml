[package]
name = "mentat"
version = "0.1.0"
description = "Mentat: the enterprise system, on the Thebes Domain Kernel."
license = "Apache-2.0"

# Pinned to the kernel's toolchain (Mercatura-Forum/thebes-kernel). The kernel is
# written against core 2.3.1 / base 0.14.13 at moc 1.4.1; a mops project resolves one
# version per package, so these are the versions, not a preference.
#
# `core 2.5.0` was in the received tree only because `ledger/` - a 15-file copy of
# kernel-shaped modules that main.mo, erp.mo and crm.mo never imported - was written
# against it. `ledger/` is deleted (the kernel package is the
# dependency), so nothing here needs 2.5.0.
[dependencies]
base = "0.14.13"
core = "2.3.1"
map = "9.0.1"
stableheapbtreemap = "1.3.0"
sha2 = "0.1.9"

[toolchain]
moc = "1.4.1"
